[package]
name = "gram-vanity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Vanity addresses for Telegram Wallet (Money), TG Wallet contract: 24 words, key made locally"
license = "MIT"
repository = "https://github.com/catchain/gram-vanity"
readme = "README.md"
keywords = ["ton", "vanity", "wallet", "telegram", "gram"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
publish = false

[dependencies]
base64 = "0.22"
bip39 = "2.1"
ed25519-dalek = "2.1"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm", "compress"] }
tar = "0.4"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
