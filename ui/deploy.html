<script src="/vendor/tonconnect-ui.min.js"></script>
<script>
"use strict";
const MANIFEST_URL = __MANIFEST_URL__;
// Move the deploy token out of the URL: TON Connect can put location.href into wallet links.
const q = new URLSearchParams(location.hash.slice(1) || (() => { try { return sessionStorage.getItem("vl-deploy") || ""; } catch (e) { return ""; } })());
if (location.hash) {
  try { sessionStorage.setItem("vl-deploy", location.hash.slice(1)); } catch (e) {}
  history.replaceState(null, "", "/deploy");
}
const id = q.get("s") || "", dtoken = q.get("d") || "";
const $ = x => document.getElementById(x);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg = (cls, text) => { $("msg").innerHTML = text ? `<div class="alert ${cls}">${esc(text)}</div>` : ""; };
const api = async path => {
  const r = await fetch("/api/deploy/" + path, {method: "POST", headers: {"X-Deploy-Token": dtoken, "Content-Type": "application/json"},
    body: JSON.stringify({id}), cache: "no-store", credentials: "omit"});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  return j;
};

let phase = "", sending = false, ui = null;
async function refresh() {
  try {
    const s = await api("state");
    $("addr").textContent = s.address.replace(/(.{4})(?=.)/g, "$1 ");
    if (s.network_error) { $("phase").textContent = "нет связи с toncenter"; return; }
    phase = s.phase;
    const bal = (Number(s.balance) / 1e9).toLocaleString("ru-RU", {maximumFractionDigits: 4});
    $("phase").innerHTML = {
      ready: `не развёрнут · ${bal} GRAM`, deployed_anchor: `развёрнут, ключ ещё не ваш · ${bal} GRAM`,
      done: `<b>ключ сменён</b> · ${bal} GRAM`, foreign: "ключ чужой",
    }[phase] || esc(phase);
    if (phase === "done") { msg("mint", "Готово. Импортируйте 24 слова в Telegram Wallet (Money)."); sending = false; }
    if (phase === "foreign") msg("red", "Ключ уже сменён на другой. Отправка заблокирована.");
    update();
  } catch (e) { msg("red", e.message); }
}
function update() {
  const connected = ui && ui.connected;
  $("send").disabled = !connected || sending || !(phase === "ready" || phase === "deployed_anchor");
  $("send").innerHTML = sending ? '<span class="spin"></span>Ждём сеть…' : phase === "done" ? "Ключ сменён" : connected ? "Отправить" : "Подключите кошелёк";
}

$("send").onclick = async () => {
  msg("", "");
  try {
    const p = await api("payload");
    const m = {address: p.address, amount: p.amount, payload: p.payload};
    if (p.state_init) m.stateInit = p.state_init;
    sending = true; update();
    await ui.sendTransaction({validUntil: p.valid_until, network: "-239", messages: [m]});
    msg("sun", "Подписано. Ждём сеть, до 30 с.");
  } catch (e) {
    sending = false; update();
    msg("red", (e && e.message) || "Транзакция отменена");
  }
};

(async () => {
  if (!id || !dtoken) { msg("red", "Откройте страницу из Gram Vanity."); return; }
  try {
    const p = await api("state");
    $("addr").textContent = p.address.replace(/(.{4})(?=.)/g, "$1 ");
  } catch (e) { msg("red", e.message); return; }
  $("amount").textContent = "0,01 GRAM";
  try {
    const pl = await api("payload");
    $("amount").textContent = (Number(pl.amount) / 1e9).toLocaleString("ru-RU") + " GRAM";
    $("key").textContent = pl.new_public_key.slice(0, 10) + "…" + pl.new_public_key.slice(-6);
  } catch (e) { $("key").textContent = "—"; }
  if (!MANIFEST_URL) {
    msg("red", "Нет tonconnect-manifest. Запустите с --manifest-url.");
  } else {
    ui = new TON_CONNECT_UI.TonConnectUI({manifestUrl: MANIFEST_URL, buttonRootId: "tc"});
    ui.onStatusChange(update);
    await ui.connectionRestored;
  }
  update(); refresh(); setInterval(refresh, 4000);
})();
</script>
</body>
</html>
